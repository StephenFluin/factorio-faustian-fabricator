[mod-setting-name]
faustian-fabricator-electricity-kw=Faustian Fabricator electricity usage (kW)
faustian-fabricator-generation-seconds=Faustian Fabricator generation interval (seconds)
faustian-fabricator-levelup-seconds=Faustian Fabricator level-up interval (seconds)
faustian-fabricator-show-message-log=Show machine event log

[mod-setting-description]
faustian-fabricator-electricity-kw=Power draw per machine in kilowatts. Takes effect after restarting the game because it changes entity prototype data.
faustian-fabricator-generation-seconds=Base seconds per generated item. Range: 3 to 180 seconds (default 10). Existing machines update immediately; speed upgrades still apply on top.
faustian-fabricator-levelup-seconds=Seconds of powered operation required for each level-up. Range: 30 to 7200 seconds (default 600).
faustian-fabricator-show-message-log=If enabled, the Machine Event Log is shown in the Faustian Fabricator GUI.
